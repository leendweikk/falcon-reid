# Web client (static page) + reverse proxy to the API container.
server {
    listen 80;
    client_max_body_size 25m;                 # full camera frames

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 120s;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
    }
}
